<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Luxury Background Gradient (Deep Forest Emerald) -->
    <linearGradient id="vhBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#263823"/>
      <stop offset="100%" stop-color="#111a10"/>
    </linearGradient>

    <!-- Metallic Luxury Gold Gradient -->
    <linearGradient id="vhGold" x1="16" y1="12" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbeef0" stop-color-alternate="#f7e4a8"/>
      <stop offset="15%" stop-color="#f5df9e"/>
      <stop offset="55%" stop-color="#d4aa42"/>
      <stop offset="100%" stop-color="#a4781f"/>
    </linearGradient>

    <!-- Subtle Border Gold Gradient -->
    <linearGradient id="vhBorder" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ebd289" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#936c1b" stop-opacity="0.45"/>
    </linearGradient>

    <!-- Radiant Sun Core Gradient -->
    <linearGradient id="vhSun" x1="32" y1="17" x2="32" y2="27" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff5cf"/>
      <stop offset="100%" stop-color="#eeb82c"/>
    </linearGradient>

    <!-- Hill Gradient -->
    <linearGradient id="vhHill" x1="16" y1="34" x2="48" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#96c243"/>
      <stop offset="100%" stop-color="#698e29"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base for crisp browser tab contrast -->
  <rect width="64" height="64" rx="16" fill="url(#vhBg)"/>
  
  <!-- Metallic Inset Frame -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="13.5" fill="none" stroke="url(#vhBorder)" stroke-width="1.5"/>

  <!-- Architectural Resort Arch -->
  <path 
    d="M17 47V28C17 19.716 23.716 13 32 13C40.284 13 47 19.716 47 28V47" 
    fill="none" 
    stroke="url(#vhGold)" 
    stroke-width="2.8" 
    stroke-linecap="round"
  />

  <!-- Golden Sun at Apex -->
  <circle cx="32" cy="22" r="4.2" fill="url(#vhSun)"/>
  
  <!-- Subtle Sun Rays -->
  <path 
    d="M32 14.8V17M32 27V29.2M24.8 22H27M37 22H39.2" 
    stroke="#fce79f" 
    stroke-width="1.6" 
    stroke-linecap="round"
  />
  <path 
    d="M26.9 16.9L28.5 18.5M35.5 25.5L37.1 27.1M26.9 27.1L28.5 25.5M35.5 18.5L37.1 16.9" 
    stroke="#fce79f" 
    stroke-width="1.3" 
    stroke-linecap="round" 
    stroke-opacity="0.85"
  />

  <!-- Rolling Hills Ridge (Foreground Nature Reserve) -->
  <path 
    d="M17.5 46C22.5 35 28 32 35 36C39.5 38.8 43 42.5 46.5 46" 
    fill="none" 
    stroke="url(#vhHill)" 
    stroke-width="3.2" 
    stroke-linecap="round"
  />
  
  <!-- Secondary Hill Layer -->
  <path 
    d="M26 45.5C29.5 39 35 37 42 44" 
    fill="none" 
    stroke="#b8e05c" 
    stroke-width="2.2" 
    stroke-linecap="round" 
    stroke-opacity="0.9"
  />

  <!-- Architectural Foundation Plinth -->
  <line x1="13" y1="47.5" x2="51" y2="47.5" stroke="url(#vhGold)" stroke-width="3" stroke-linecap="round"/>
</svg>